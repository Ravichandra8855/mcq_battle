{% extends "quiz/base.html" %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Login</button>
  </form>
  <p class="muted">No account? <a href="{% url 'register' %}" style="color:#818cf8">Register</a></p>
</div>
{% endblock %}

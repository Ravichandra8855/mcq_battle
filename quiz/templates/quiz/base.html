<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MCQ Battle{% endblock %}</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --brand:#6366f1; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  nav { display:flex; gap:16px; align-items:center; padding:14px 24px; background:var(--card); }
  nav a { color:var(--text); text-decoration:none; } nav .brand { font-weight:700; color:var(--brand); margin-right:auto; }
  nav form { display:inline; } nav button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:1em; }
  main { max-width:720px; margin:32px auto; padding:0 16px; }
  .card { background:var(--card); padding:24px; border-radius:14px; margin-bottom:20px; }
  h1,h2 { margin-top:0; }
  input { width:100%; padding:12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); margin:6px 0 12px; }
  .btn { display:inline-block; padding:12px 20px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:1em; cursor:pointer; text-decoration:none; }
  .btn:hover { opacity:.9; } .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; } td,th { padding:10px; text-align:left; border-bottom:1px solid #334155; }
  .errorlist { color:var(--bad); padding-left:18px; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">⚔️ MCQ Battle</a>
  {% if user.is_authenticated %}
    <a href="{% url 'leaderboard' %}">Leaderboard</a>
    <span class="muted">{{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Logout</button></form>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
